name: GCC Investment Engine Automation

on:
  schedule:
    # يعمل آلياً كل 6 ساعات (يمكنك تعديل الجدول حسب رغبتك)
    - cron: '0 */6 * * *'
  workflow_dispatch: # يتيح لك التشغيل اليدوي للـ Workflow بأي وقت بنقرة زر

jobs:
  run-engine:
    runs-on: ubuntu-latest

    permissions:
      contents: write # إعطاء الصلاحيات لـ GitHub Actions لكتابة وحفظ التغييرات في المستودع

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Engine Script
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
        run: |
          python main.py  # استبدل main.py باسم ملف البايثون الرئيسي لديك إذا كان مختلفاً

      - name: Commit and Push Updated Sent Log
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add sent_opportunities.json
          git commit -m "Auto-update sent opportunities history [skip ci]" || echo "No changes to commit"
          git push
